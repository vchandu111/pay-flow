# SonarQube scanner configuration for PayFlow.
# Run with: sonar-scanner -Dsonar.token=<your-token>
# (host defaults to http://localhost:9000; override with -Dsonar.host.url if needed)

sonar.projectKey=payflow
sonar.projectName=PayFlow
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src,tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/prisma/migrations/**
sonar.test.inclusions=tests/**/*.ts,**/*.test.ts,**/*.test.tsx

sonar.javascript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json
